    <main class="page-container">
        <h2>Let's talk</h2>
        <p>I usually reply within 24-48 hours.</p>
        <form class="contact__form" action="https://formspree.io/f/mjybydza" method="POST">
            <input type="text" name="name" placeholder="Your name" required>
            <input type="email" name="email" placeholder="Your email" required>
            <textarea name="message" id="formMessage" rows="4" placeholder="Tell me about your project" required></textarea>
            <button type="submit" class="contact__submit">Send</button>
        </form>
        <div class="contact__socials">
            <a href="https://www.youtube.com/@WillyBeyond" target="_blank"><img src="icons/youtube.svg" alt="YouTube"></a>
